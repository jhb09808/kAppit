<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Kapit mark: two interlocked rings, woven over-under. Indigo #6A3FA0 + Vermilion #F2A93B -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <!-- Left ring (indigo): gap at top crossing, passes over at bottom -->
    <path d="M 56.79 50.16 A 20 20 0 1 1 39.40 37.05" stroke="#6A3FA0"/><circle cx="42.5" cy="21.5" r="7.5" fill="#6A3FA0"/>
    <!-- Right ring (vermilion): gap at bottom crossing, passes over at top -->
    <path d="M 43.23 63.89 A 20 20 0 1 1 60.65 76.95" stroke="#F2A93B"/><circle cx="57.5" cy="21.5" r="7.5" fill="#F2A93B"/>
  </g>
</svg>
